# =============================================================================
# Skeleton-conditioned IC-LoRA -- structural control that H3 does not ship with
# =============================================================================
#
# H3 has no ControlNet, no pose input, no depth or edge branch. IC-LoRA is how
# you add one: a rendered skeleton video is packed into the sequence as an
# in-context reference,
#
#     [ text | skeleton reference rows | target audio | target video ]
#
# and the adapter learns that the target should follow it. Reference rows attend
# in both directions, sit at their pinned conditioning timestep, and carry no
# loss -- so nothing here trains the model to reproduce skeletons, only to obey
# them.
#
# Two things differ from configs/ref2va_ic_lora.yaml, and both matter:
#
#   * probability: 1.0. Identity references are dropped occasionally so the
#     adapter still works unconditioned. A structural reference is the entire
#     instruction -- dropping it teaches the adapter to invent motion, which is
#     the failure mode this config exists to avoid.
#   * a portrait bucket. Square crops of full-body footage cut the legs off, and
#     a pose adapter that never sees ankles cannot place feet.
#
# The bucket is 448x768, and that costs real time. A reference costs as many rows
# as the target, and attention over the packed sequence is unmasked and quadratic:
# 448x768x124 with a reference measures 27,364 rows at ~82 s/step on 4 A6000s,
# where 320x576x124 measures 14,884 rows at ~24-37 s/step. So 600 steps is roughly
# 14 hours rather than 5. Frames cannot be traded away instead -- H3 generates 124
# frames (5.17 s) at the short end.
#
# It is worth the time. An earlier run of this config at 320x576 followed skeletons
# correctly but rendered them softly, and that softness is the bucket rather than
# the adapter: H3's own canvas is 768 on the short edge, so generating below it is
# off distribution for the base model too.
#
# WHERE THE DATA COMES FROM, and why it is not the obvious source. Public dance
# datasets are scraped footage of people who did not consent to train anything, so
# an adapter fitted to them cannot be released. Every frame behind this config is
# generated instead: eight synthetic people from H3 itself, set dancing by
# Wan-Dancer (Apache-2.0), which is a different model -- generating the targets
# with H3 would be self-distillation and would teach the adapter only H3's own
# distribution back. The clips are muxed silent, so the driving music never enters
# the weights.
#
# Then scripts/extract_pose.py renders MediaPipe skeletons frame-aligned with
# their source clips and rejects anything not showing a full body:
#
#   python scripts/normalize_clips.py dances/ ${H3_DATASETS}/pose_wan/clips \
#       --resolution-bucket 448x768x124 --stride 1.7 --drop-audio
#   python scripts/extract_pose.py ${H3_DATASETS}/pose_wan/clips ${H3_DATASETS}/pose_wan \
#       --resolution-bucket 448x768x124
#   python scripts/split_manifest.py ${H3_DATASETS}/pose_wan/dataset.json --holdout 4
#   python scripts/process_dataset.py ${H3_DATASETS}/pose_wan/dataset_train.json \
#       --resolution-bucket 448x768x124 --references --reference-canvas target
#   python scripts/train.py configs/pose_ic_lora.yaml
#
# One whole person -- ref02 -- is held out of all of that. Validation generates
# from a skeleton of someone the adapter has never seen, dancing a pairing it has
# never seen, which is a stronger claim than a held-out clip of a familiar dancer.
# =============================================================================

model:
  model_path: ${H3_MODEL_PATH}
  variant: ref2va
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions:
    - type: reference
      modality: video
      latents_dir: reference_latents
      probability: 1.0
  audio:
    # The source footage is silent. Zero audio latents are weighted to 0 rather
    # than dropped -- see docs/h3-quirks.md #4; dropping the term desynchronizes
    # ranks. The audio head is present in the graph and learns nothing.
    is_generated: true
    latents_dir: audio_latents
    conditions: []
optimization:
  learning_rate: 0.0001
  steps: 600
  batch_size: 1
  # 1, not 4. The cost of a run is sample-passes, not optimizer steps: one pass
  # over a 27,364-row sample measures ~81 s on 4 A6000s, so accumulating 4 of them
  # makes a single step cost 324 s -- measured, across three consecutive steps --
  # and 600 steps then runs 54 hours rather than the 14 the per-pass figure
  # suggests. At batch 1 the same 600 steps are 600 passes in ~13.5 h, trading
  # gradient smoothing for four times as many updates. Standard for LoRA, and with
  # only 40 training samples the extra epochs bought by accumulation are closer to
  # overfitting than to signal.
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  warmup_steps: 30
  enable_gradient_checkpointing: true
  # A 448x768x124 target plus a reference of the same geometry measures 27,364
  # rows. The gate sits above that so nothing is silently skipped -- and it must
  # move whenever the bucket does. Left at the 320x576 value of 24000 this gate
  # skips every sample in the dataset and the run trains on nothing, quietly.
  max_seq_tokens: 30000
acceleration:
  # ZeRO-3 cannot start on 48GB cards (each rank materializes 66GB before
  # partitioning). model_parallel splits the blocks across GPUs instead.
  strategy: model_parallel
  mixed_precision_mode: bf16
  quantization: none
  offload_optimizer_during_validation: false
data:
  preprocessed_data_root: ${H3_DATASETS}/pose_wan/.precomputed448
  num_dataloader_workers: 2
  val_split_every: 10
  shuffle: true
validation:
  samples:
  - prompt: a person dancing, full body in frame, following the motion of the reference skeleton
    conditions:
    - type: reference
      video: ${H3_DATASETS}/pose_wan/heldout_poses/ref02_latin_00.mp4
  video_dims:
  - 448
  - 768
  - 124
  frame_rate: 24.0
  seed: 42
  inference_steps: 20
  interval: 150
  # Generate from a HELD-OUT skeleton at every checkpoint: a clip that was never
  # encoded, so following it cannot be memorization. This is the check the loss
  # cannot make, and it is affordable because validation prompts are encoded
  # before the transformer is placed (see validation_runner).
  #
  # This was briefly disabled after it appeared to hang for 1h50m. The cause was a
  # bug, not a hardware limit: the runner handed the pipeline its transformer under
  # the wrong component name, so the adapter never reached the sampler and denoising
  # fell back to CPU. Fixed in validation_runner, covered by
  # tests/test_validation_transformer_component.py.
  sample_media: true
  loss_sigmas:
  - 0.3
  - 0.6
  - 0.9
  max_loss_samples: 6
  skip_initial_validation: true
checkpoints:
  interval: 150
  keep_last_n: 5
  precision: bfloat16
  save_training_state: full
flow_matching:
  timestep_sampling_mode: uniform
  timestep_sampling_params: {}
  video_shift: 12.0
  audio_shift: 3.0
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: true
  project: minimax-h3-agentic-trainer
  entity: null
  name: pose-ic-lora-wan
  tags:
  - h3
  - ic-lora
  - pose
  log_validation_videos: true
seed: 42
output_dir: ${H3_RUNS}/pose_wan_ic_lora
