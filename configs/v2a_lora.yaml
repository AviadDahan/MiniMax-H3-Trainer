# =============================================================================
# MiniMax-H3 video-to-audio LoRA (foley / voice on existing footage)
# =============================================================================
#
# Only the modality flags change: video is packed clean (sigma = 0, t = 1) as
# frozen conditioning and excluded from the loss, while audio is noised and
# predicted. Everything else -- packing, numerics, checkpointing -- is shared.
# That is the point of the flexible strategy: a training mode is a config, not a
# code path.
# =============================================================================

model:
  model_path: ${H3_MODEL_PATH}
  variant: fl2va
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
training_strategy:
  name: flexible
  video:
    is_generated: false
    latents_dir: latents
    conditions: []
  audio:
    is_generated: true
    latents_dir: audio_latents
    conditions: []
optimization:
  learning_rate: 0.0001
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  warmup_steps: 50
  enable_gradient_checkpointing: true
  max_seq_tokens: 70000
acceleration:
  strategy: deepspeed_zero3
  mixed_precision_mode: bf16
  quantization: none
  offload_optimizer_during_validation: false
data:
  preprocessed_data_root: ${H3_DATASETS}/character/.precomputed
  num_dataloader_workers: 2
  val_split_every: 20
  shuffle: true
validation:
  samples:
  - prompt: A woman with long brown hair sits at a wooden desk in a home office, typing on a laptop while
      soft afternoon light falls through the window beside her. The audio carries the click of keys, the
      rustle of paper and faint birdsong from outside.
  - prompt: A chef in a white jacket plates a dish in a busy restaurant kitchen, steam rising from the
      pan behind him. The audio has sizzling, the clink of metal on porcelain and the low hum of extraction
      fans.
  video_dims:
  - 704
  - 704
  - 124
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: 250
  sample_media: true
  loss_sigmas:
  - 0.3
  - 0.6
  - 0.9
  max_loss_samples: 8
  skip_initial_validation: false
checkpoints:
  interval: 250
  keep_last_n: 5
  precision: bfloat16
  save_training_state: full
flow_matching:
  timestep_sampling_mode: uniform
  timestep_sampling_params: {}
  video_shift: 12.0
  audio_shift: 3.0
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: minimax-h3-agentic-trainer
  entity: null
  name: null
  tags:
  - h3
  - lora
  - v2a
  log_validation_videos: true
seed: 42
output_dir: ${H3_RUNS}/v2a_lora
