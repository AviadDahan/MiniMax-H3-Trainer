# =============================================================================
# MiniMax-H3 image-to-video LoRA (first-frame conditioning)
# =============================================================================
#
# The keyframe is packed as a conditioning block ahead of the target rows, pinned
# just shy of clean (t = 0.999, matching inference noise augmentation) and left
# out of the loss -- it is an input, not a target.
#
# probability: 0.9 rather than 1.0 keeps a slice of unconditioned steps, so the
# adapter does not forget how to generate from text alone.
#
# Preprocess with the keyframe encoded and embedded in the prompt presentation:
#   python scripts/process_dataset.py dataset.json --keyframes first_frame ...
# =============================================================================

model:
  model_path: /data/aviad/models/MiniMax-H3
  variant: fl2va
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions:
    - type: first_frame
      latents_dir: first_frame_latents
      probability: 0.9
  audio:
    is_generated: true
    latents_dir: audio_latents
    conditions: []
optimization:
  learning_rate: 0.0001
  steps: 2000
  batch_size: 1
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  warmup_steps: 50
  enable_gradient_checkpointing: true
  max_seq_tokens: 70000
acceleration:
  strategy: deepspeed_zero3
  mixed_precision_mode: bf16
  quantization: none
  offload_optimizer_during_validation: false
data:
  preprocessed_data_root: /data/aviad/datasets/character/.precomputed
  num_dataloader_workers: 2
  val_split_every: 20
  shuffle: true
validation:
  samples:
  - prompt: A woman with long brown hair sits at a wooden desk in a home office, typing on a laptop while
      soft afternoon light falls through the window beside her. The audio carries the click of keys, the
      rustle of paper and faint birdsong from outside.
  - prompt: A chef in a white jacket plates a dish in a busy restaurant kitchen, steam rising from the
      pan behind him. The audio has sizzling, the clink of metal on porcelain and the low hum of extraction
      fans.
  video_dims:
  - 704
  - 704
  - 124
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: 250
  sample_media: true
  loss_sigmas:
  - 0.3
  - 0.6
  - 0.9
  max_loss_samples: 8
  skip_initial_validation: false
checkpoints:
  interval: 250
  keep_last_n: 5
  precision: bfloat16
  save_training_state: full
flow_matching:
  timestep_sampling_mode: uniform
  timestep_sampling_params: {}
  video_shift: 12.0
  audio_shift: 3.0
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: h3-trainer
  entity: null
  name: null
  tags:
  - h3
  - lora
  - i2v
  log_validation_videos: true
seed: 42
output_dir: /data/aviad/runs/i2v_lora
