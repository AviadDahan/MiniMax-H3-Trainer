# =============================================================================
# Character AV LoRA -- appearance and voice of one character, from captions alone
# =============================================================================
#
# Trains on clips generated by scripts/generate_character_dataset.py: one identity
# anchor, one voice reference, and N Ref2VA generations conditioned on both. The
# adapter has to internalise *both* modalities, so audio is generated and in the
# loss alongside video.
#
# Acceleration: model_parallel. On 48GB cards the 66GB bf16 transformer cannot be
# replicated per rank (which is what ZeRO-3 needs before it can partition), and
# 4-bit quantization visibly degrades this model. Splitting the blocks across the
# GPUs in one process keeps full precision; the cost is no data parallelism, which
# gradient_accumulation_steps compensates for.
#
#   python scripts/train.py configs/character_av_lora.yaml
# =============================================================================

model:
  model_path: /data/aviad/models/MiniMax-H3
  variant: fl2va
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 16
  alpha: 16
  dropout: 0.0
  target_modules:
  - to_q
  - to_k
  - to_v
  - to_out.0
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions: []
  audio:
    is_generated: true
    latents_dir: audio_latents
    conditions: []
optimization:
  learning_rate: 0.0001
  steps: 1200
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  warmup_steps: 40
  enable_gradient_checkpointing: true
  max_seq_tokens: 24000
acceleration:
  strategy: model_parallel
  mixed_precision_mode: bf16
  quantization: none
  offload_optimizer_during_validation: false
data:
  preprocessed_data_root: /data/aviad/datasets/character/.precomputed
  num_dataloader_workers: 2
  val_split_every: 10
  shuffle: true
validation:
  samples:
  - prompt: 'OHWXMIRA, a close-up of a woman seated by a window in soft daylight. She speaks in a warm,
      slightly husky mid-range voice: "I did not expect it to be this quiet up here." The audio is her
      clear speech in a still room.'
  - prompt: 'OHWXMIRA, a medium shot of a woman standing in a busy market, turning to the camera. She
      speaks in a warm, slightly husky mid-range voice: "Come and look at this before it goes." The audio
      has her speech over market chatter.'
  video_dims:
  - 512
  - 512
  - 124
  frame_rate: 24.0
  seed: 42
  inference_steps: 20
  interval: 300
  sample_media: false
  loss_sigmas:
  - 0.3
  - 0.6
  - 0.9
  max_loss_samples: 4
  skip_initial_validation: false
checkpoints:
  interval: 300
  keep_last_n: 4
  precision: bfloat16
  save_training_state: full
flow_matching:
  timestep_sampling_mode: uniform
  timestep_sampling_params: {}
  video_shift: 12.0
  audio_shift: 3.0
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: h3-trainer
  entity: null
  name: null
  tags:
  - h3
  - lora
  - character
  - av
  log_validation_videos: true
seed: 42
output_dir: /data/aviad/runs/character_av_lora
