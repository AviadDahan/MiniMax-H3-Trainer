[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minimax-h3-agentic-trainer"
version = "0.1.0"
description = "LoRA and IC-LoRA training for MiniMax-H3 (joint video + stereo audio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # H3's classes are in no released diffusers wheel, so the integration commit is
    # pinned as a direct reference. Without this line an install of this package
    # produces an environment where h3_trainer.constants raises on import.
    "diffusers @ git+https://github.com/huggingface/diffusers.git@abc5e9bf71fd38f53cd471bc3acaa84bc5ecbfdc",
    "torch>=2.8",
    "torchaudio",
    "torchvision",
    "transformers>=5.15,<6",
    "accelerate>=1.10",
    "deepspeed>=0.18",
    "peft>=0.18",
    "safetensors>=0.4",
    "av>=12",
    "huggingface_hub>=0.26",
    "pydantic>=2.7",
    "pyyaml",
    "numpy",
    "pillow",
    "tqdm",
    "rich",
    "wandb",
]

[project.optional-dependencies]
quant = ["optimum-quanto", "bitsandbytes"]
dev = ["pytest", "ruff", "matplotlib", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# A table of scene descriptions, one row per scene. Wrapping each row over three
# lines makes it harder to scan, not easier.
"scripts/generate_character_dataset.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
