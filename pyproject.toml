[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "h3-trainer"
version = "0.1.0"
description = "LoRA and IC-LoRA training for MiniMax-H3 (joint video + stereo audio)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "torch>=2.8",
    "torchaudio",
    "torchvision",
    "transformers>=5.15,<6",
    "accelerate>=1.10",
    "deepspeed>=0.18",
    "peft>=0.18",
    "safetensors>=0.4",
    "av>=12",
    "huggingface_hub>=0.26",
    "pydantic>=2.7",
    "pyyaml",
    "numpy",
    "pillow",
    "tqdm",
    "rich",
    "wandb",
]

[project.optional-dependencies]
quant = ["optimum-quanto", "bitsandbytes"]
dev = ["pytest", "ruff", "matplotlib", "pandas"]

[project.scripts]
h3-train = "h3_trainer.cli:train_main"
h3-process-dataset = "h3_trainer.cli:process_dataset_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
